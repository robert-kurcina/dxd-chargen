<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sarna Len Character Sheet</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="sheet-values.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="brand-mark">SL</span>
      <div><strong>Sarna Len</strong><span>Character Sheet</span></div>
    </div>
    <div class="page-tabs" role="tablist" aria-label="Sheet side">
      <button id="front-tab" class="tab active" data-page="front" role="tab" aria-controls="front" aria-selected="true" tabindex="0">Front</button>
      <button id="back-tab" class="tab" data-page="back" role="tab" aria-controls="back" aria-selected="false" tabindex="-1">Back</button>
    </div>
    <div class="actions">
      <div class="view-controls" role="group" aria-label="Sheet zoom">
        <button id="zoom-out" class="quiet" type="button" aria-label="Zoom out">−</button>
        <output id="zoom-value" aria-live="polite">100%</output>
        <button id="zoom-in" class="quiet" type="button" aria-label="Zoom in">+</button>
        <button id="fit-page" class="quiet" type="button">Fit page</button>
        <button id="fit-width" class="quiet" type="button">Fit width</button>
      </div>
      <label class="character-control">
        <span>Character</span>
        <select id="character-select" aria-label="Character" disabled></select>
      </label>
      <label class="level-control">PML <input id="pml" type="number" min="0" max="12" value="0" disabled></label>
      <button id="edit">Edit</button>
      <button id="undo" class="quiet" hidden>Undo</button>
      <button id="update" hidden>Update</button>
      <button id="save" hidden>Save</button>
      <button id="revert" class="quiet" hidden>Revert</button>
      <button id="download" class="quiet" title="Download character data">Download</button>
      <button id="export-pdf" class="quiet" title="Export both sheet sides as PDF">Export PDF</button>
    </div>
  </header>

  <main>
    <div class="sheet-shell">
      <section id="front" class="sheet-page active" role="tabpanel" aria-labelledby="front-tab" aria-label="Character sheet front">
        <img class="sheet-art" src="/character-creator/img/crs-front.png" alt="Sarna Len character sheet front">
        <div class="sheet-fields" id="front-fields"></div>
        <img id="affinity-decal" class="affinity-decal" src="/api/data-assets/decals/decal-zed-affinity.png" alt="Magic affinity">
        <img class="portrait" src="/character-creator/img/portrait-placeholder.png" alt="Character portrait">
      </section>

      <section id="back" class="sheet-page" role="tabpanel" aria-labelledby="back-tab" aria-label="Character sheet back" hidden>
        <img class="sheet-art" src="/character-creator/img/crs-back.png" alt="Sarna Len character sheet back">
        <div class="sheet-fields" id="back-fields"></div>
      </section>
    </div>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
